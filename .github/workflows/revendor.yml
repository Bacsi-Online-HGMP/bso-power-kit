name: revendor

# Weekly upstream drift check for everything vendored under plugins/ and tools/.
#
# Vendored code is a snapshot: an upstream fix never arrives on its own, and
# nobody notices a plugin is two releases behind until they read its code. This job
# runs revendor.sh in check mode every Monday. When something has drifted it pulls
# exactly those entries, applies the vendor patches, and opens a pull request.
#
# A row that cannot be checked or pulled fails the run. The job used to skip it and
# go green, which is how a plugin can sit behind for weeks with nobody told.
#
# A PR rather than a commit, on purpose. Re-vendoring replaces whole plugin
# directories -- that diff gets reviewed, same rule as running the script by hand.
#
# Chosen over a macOS LaunchAgent: this runs without the laptop awake, and its
# output is a reviewable PR instead of a log file nobody opens.

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Entries to re-vendor (sources.tsv first column), space separated. Empty = every drifted one.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: revendor
  cancel-in-progress: false

jobs:
  revendor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # revendor.sh resolves release tags with `gh api`
      BRANCH: revendor/auto
      PLUGINS: ${{ inputs.plugins }}
    steps:
      - uses: actions/checkout@v7

      - name: Report upstream drift
        id: check
        run: |
          set -o pipefail
          bash revendor.sh | tee "$RUNNER_TEMP/drift.txt"
          # Pull only what drifted, so the pull request carries nothing else. A manual
          # run can name entries instead.
          drifted="$(awk '$1 == "DRIFT" {print $2}' "$RUNNER_TEMP/drift.txt" | tr '\n' ' ')"
          echo "targets=${PLUGINS:-$drifted}" >> "$GITHUB_OUTPUT"

      # No continue-on-error here: a failed pull, a failed vendor patch, or a broken
      # skill reference must not become a pull request. Fix it, then re-run.
      - name: Re-vendor
        if: steps.check.outputs.targets != ''
        env:
          TARGETS: ${{ steps.check.outputs.targets }}
        run: bash revendor.sh --apply $TARGETS

      - name: Open or update the pull request
        if: steps.check.outputs.targets != ''
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Upstream drifted but the pull changed nothing tracked. No PR."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: re-vendor plugins from upstream'
          # Force push: a second week of drift updates the open PR instead of stacking
          # a second one. The branch is disposable; main is the only history that matters.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          {
            echo 'Opened by the weekly `revendor` job. Review the plugin diffs before merging.'
            echo
            echo 'Drift reported before the pull:'
            echo
            echo '```'
            cat "$RUNNER_TEMP/drift.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated the open PR."
          else
            gh pr create --base main --head "$BRANCH" \
              --title 'chore: re-vendor plugins from upstream' \
              --body-file "$RUNNER_TEMP/body.md"
          fi
